[project]
name = "langchainl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pratik", email = "pratikwankhede503@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
